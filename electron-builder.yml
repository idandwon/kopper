---
appId: com.kopper.app
productName: Kopper
artifactName: Kopper-${version}-${arch}.${ext}
publish: null
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - node_modules/uiohook-napi/**
npmRebuild: true
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  minimumSystemVersion: "14.0"
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  x64ArchFiles: >-
    Contents/Resources/app.asar.unpacked/node_modules/uiohook-napi/prebuilds/darwin-*/uiohook-napi.node
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  extendInfo:
    NSAppleEventsUsageDescription: >-
      Kopper uses System Events only when you invoke capture, so it can copy the
      text you selected.
    NSHumanReadableCopyright: Copyright © 2026 Kopper contributors.
dmg:
  sign: false
