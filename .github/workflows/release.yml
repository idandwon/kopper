---
name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-14
    environment: release

    steps:
      - name: Check out tagged revision
        # actions/checkout v4 => 11d5960a326750d5838078e36cf38b85af677262
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        # actions/setup-node v4 => 49933ea5288caeca8642d1e84afbd3f7d6820020
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Prepare Apple API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_directory="$RUNNER_TEMP/kopper-release-secrets"
          key_path="$key_directory/AuthKey_${APPLE_API_KEY_ID}.p8"
          rm -rf -- "$key_directory"
          umask 077
          mkdir -p "$key_directory"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"

      - name: Build signed and notarized release
        env:
          APPLE_API_KEY: >-
            ${{ runner.temp }}/kopper-release-secrets/AuthKey_${{
            secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: pnpm package:release

      - name: Generate exact release assets
        id: assets
        run: |
          version="$(node -p "require('./package.json').version")"
          dmg_name="Kopper-${version}-universal.dmg"
          test -f "release/$dmg_name"
          test -f install.sh
          bash -n install.sh
          (cd release && shasum -a 256 "$dmg_name" > "$dmg_name.sha256")
          checksum_name="${dmg_name}.sha256"
          output="$GITHUB_OUTPUT"
          printf 'dmg_path=release/%s\n' "$dmg_name" >> "$output"
          printf 'checksum_path=release/%s\n' "$checksum_name" >> "$output"
          printf 'installer_path=install.sh\n' >> "$output"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_PATH: ${{ steps.assets.outputs.dmg_path }}
          CHECKSUM_PATH: ${{ steps.assets.outputs.checksum_path }}
          INSTALLER_PATH: ${{ steps.assets.outputs.installer_path }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$DMG_PATH" \
            "$CHECKSUM_PATH" \
            "$INSTALLER_PATH" \
            --verify-tag \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove temporary Apple API key
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/kopper-release-secrets"
