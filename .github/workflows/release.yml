---
name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build unsigned friends beta
    runs-on: macos-14
    environment: release

    steps:
      - name: Check out tagged revision
        # actions/checkout v4 => 11d5960a326750d5838078e36cf38b85af677262
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        # actions/setup-node v4 => 49933ea5288caeca8642d1e84afbd3f7d6820020
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify exact tag version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v${package_version}"
          test "$(git describe --tags --exact-match HEAD)" = "$GITHUB_REF_NAME"

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build application
        run: pnpm build

      - name: Run Electron end-to-end tests
        run: env -u ELECTRON_RUN_AS_NODE pnpm test:e2e

      - name: Audit production dependencies
        run: pnpm audit:deps

      - name: Audit application source
        run: pnpm audit:source

      - name: Build unsigned universal DMG
        run: pnpm package:beta

      - name: Verify unsigned package
        run: pnpm verify:package "release/mac-universal/Kopper.app"

      - name: Generate exact release assets
        id: assets
        run: |
          version="$(node -p "require('./package.json').version")"
          dmg_name="Kopper-${version}-universal.dmg"
          test -f "release/$dmg_name"
          test -f install.sh
          bash -n install.sh
          (cd release && shasum -a 256 "$dmg_name" > "$dmg_name.sha256")
          checksum_name="${dmg_name}.sha256"
          output="$GITHUB_OUTPUT"
          {
            printf 'dmg_path=release/%s\n' "$dmg_name"
            printf 'checksum_path=release/%s\n' "$checksum_name"
            printf 'installer_path=install.sh\n'
          } >> "$output"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_PATH: ${{ steps.assets.outputs.dmg_path }}
          CHECKSUM_PATH: ${{ steps.assets.outputs.checksum_path }}
          INSTALLER_PATH: ${{ steps.assets.outputs.installer_path }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$DMG_PATH" \
            "$CHECKSUM_PATH" \
            "$INSTALLER_PATH" \
            --verify-tag \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
