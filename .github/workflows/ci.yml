---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify macOS application
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        # actions/checkout v4 => 11d5960a326750d5838078e36cf38b85af677262
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js 24
        # actions/setup-node v4 => 49933ea5288caeca8642d1e84afbd3f7d6820020
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run type checking
        run: pnpm typecheck

      - name: Build application
        run: pnpm build

      - name: Run Electron end-to-end tests
        id: e2e
        run: pnpm test:e2e

      - name: Audit production dependencies
        run: pnpm audit:deps

      - name: Audit application source
        run: pnpm audit:source

      - name: Package unsigned application
        id: package_unsigned
        run: pnpm package:unsigned

      - name: Upload failure Playwright traces
        if: >-
          failure() &&
          steps.e2e.outcome == 'failure' &&
          hashFiles('test-results/**/trace.zip') != ''
        continue-on-error: true
        # actions/upload-artifact v4 => ea165f8d65b6e75b540449e92b4886f43607fa02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-traces-${{ github.run_id }}
          path: test-results/**/trace.zip
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 3

      - name: Upload failed unsigned application
        if: >-
          failure() &&
          steps.package_unsigned.outcome == 'failure' &&
          hashFiles('release/mac-universal/Kopper.app/**') != ''
        continue-on-error: true
        # actions/upload-artifact v4 => ea165f8d65b6e75b540449e92b4886f43607fa02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-application-${{ github.run_id }}
          path: release/mac-universal/Kopper.app
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 3
